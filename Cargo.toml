[package]
name = "ttsandsttp"
version = "1.3.0"
edition = "2021"

[dependencies]
sherpa-rs = { version = "0.6", features = ["tts"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["stream", "json"] }
tar = "0.4"
bzip2 = "0.6"
dirs = "6.0"
indicatif = "0.18"
bytes = "1.5"
futures = "0.3"
rodio = "0.21"
cpal = "0.17"
zbus = { version = "5", features = ["tokio"] }
zvariant = "5"
wrtype = { git = "https://github.com/connerohnesorge/wrtype" }
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = "1.8"
base64 = "0.22"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
rpassword = "7"
