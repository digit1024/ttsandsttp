[package]
name = "ttsandsttp"
version = "0.1.0"
edition = "2021"

[dependencies]
sherpa-rs = { version = "0.6", features = ["tts"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["stream"] }
tar = "0.4"
bzip2 = "0.4"
dirs = "5.0"
indicatif = "0.17"
bytes = "1.5"
futures = "0.3"
rodio = "0.17"
cpal = "0.15"
zbus = { version = "4", features = ["tokio"] }
zvariant = "4"
enigo = "0.2"
wrtype = "0.1"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
